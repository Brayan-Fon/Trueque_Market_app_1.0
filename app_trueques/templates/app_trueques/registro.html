{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Trueque Market</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'app_trueques/css/global.css' %}">
    <link rel="stylesheet" href="{% static 'app_trueques/css/login.css' %}">

    <style>
        .password-container {
            position: relative;
            width: 100%;
        }
        .password-container input {
            width: 100%;
            padding-right: 40px;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }
        .toggle-password svg {
            width: 22px;
            height: 22px;
            fill: #555;
            transition: 0.3s;
        }
        .toggle-password:hover svg { fill: #007bff; }

        .input-error { border: 1.5px solid #e74c3c !important; }
        .input-ok    { border: 1.5px solid #27ae60 !important; }
        .campo-msg {
            font-size: 11px;
            margin: -8px 0 8px 2px;
            min-height: 16px;
        }
        .campo-msg.error { color: #e74c3c; }
        .campo-msg.ok    { color: #27ae60; }

    </style>
</head>
<body>
    <div class="login-background">
        <div class="login-card">
            <img src="{% static 'app_trueques/img/logo.png' %}" alt="Logo" class="logo">
            <h2>Crear Cuenta</h2>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST" id="form-registro">
                {% csrf_token %}

                <!-- USUARIO -->
                <input type="text" id="username" name="username"
                       placeholder="Usuario" required autocomplete="off">
                <p class="campo-msg" id="msg-username"></p>

                <!-- EMAIL -->
                <input type="email" id="email" name="email"
                       placeholder="Correo electrónico" required autocomplete="off">
                <p class="campo-msg" id="msg-email"></p>

                <!-- CÉDULA — debe coincidir con MetaMap -->
                <input type="text" id="cedula" name="cedula"
                       placeholder="Cédula" required autocomplete="off"
                       inputmode="numeric">
                <p class="campo-msg" id="msg-cedula"></p>

                <!-- CONTRASEÑA -->
                <div class="password-container">
                    <input type="password" id="password1" name="password1"
                           placeholder="Contraseña" required>
                    <button type="button" class="toggle-password"
                            onclick="togglePassword('password1', this)">
                        <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M12 4.5C7 4.5 2.73 8.11 1 12c1.73 3.89 6 7.5 11 7.5s9.27-3.61 11-7.5C21.27 8.11 17 4.5 12 4.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/>
                        </svg>
                        <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display:none">
                            <path d="M12 6a9.77 9.77 0 0 1 9 6 9.77 9.77 0 0 1-9 6 9.77 9.77 0 0 1-9-6 9.77 9.77 0 0 1 9-6m0-2C6 4 1.73 7.61 0 12c1.73 4.39 6 8 12 8s10.27-3.61 12-8c-1.73-4.39-6-8-12-8m0 5a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/>
                            <line x1="2" y1="2" x2="22" y2="22" stroke="#555" stroke-width="2"/>
                        </svg>
                    </button>
                </div>
                <p class="campo-msg" id="msg-password1"></p>

                <!-- CONFIRMAR CONTRASEÑA -->
                <div class="password-container">
                    <input type="password" id="password2" name="password2"
                           placeholder="Confirmar Contraseña" required>
                    <button type="button" class="toggle-password"
                            onclick="togglePassword('password2', this)">
                        <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M12 4.5C7 4.5 2.73 8.11 1 12c1.73 3.89 6 7.5 11 7.5s9.27-3.61 11-7.5C21.27 8.11 17 4.5 12 4.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/>
                        </svg>
                        <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display:none">
                            <path d="M12 6a9.77 9.77 0 0 1 9 6 9.77 9.77 0 0 1-9 6 9.77 9.77 0 0 1-9-6 9.77 9.77 0 0 1 9-6m0-2C6 4 1.73 7.61 0 12c1.73 4.39 6 8 12 8s10.27-3.61 12-8c-1.73-4.39-6-8-12-8m0 5a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/>
                            <line x1="2" y1="2" x2="22" y2="22" stroke="#555" stroke-width="2"/>
                        </svg>
                    </button>
                </div>
                <p class="campo-msg" id="msg-password2"></p>

                <button type="submit" class="btn-submit" id="btn-registrar">
                    Registrarse
                </button>
            </form>

            <p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión aquí</a></p>
        </div>
    </div>

    <script>

        // =====================
        // VALIDAR USUARIO
        // =====================
        document.getElementById('username').addEventListener('input', function () {
            const val = this.value.trim();
            const msg = document.getElementById('msg-username');
            const regex = /^[a-zA-Z0-9_]+$/;
            if (val === '') {
                this.className = ''; msg.textContent = '';
            } else if (!regex.test(val)) {
                this.classList.add('input-error'); this.classList.remove('input-ok');
                msg.textContent = '❌ Solo letras, números y guion bajo ( _ ). Sin espacios.';
                msg.className = 'campo-msg error';
            } else {
                this.classList.add('input-ok'); this.classList.remove('input-error');
                msg.textContent = '✅ Usuario válido';
                msg.className = 'campo-msg ok';
            }
        });

        // =====================
        // VALIDAR EMAIL
        // =====================
        document.getElementById('email').addEventListener('input', function () {
            const val = this.value.trim();
            const msg = document.getElementById('msg-email');
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (val === '') {
                this.className = ''; msg.textContent = '';
            } else if (!regex.test(val)) {
                this.classList.add('input-error'); this.classList.remove('input-ok');
                msg.textContent = '❌ Correo no válido';
                msg.className = 'campo-msg error';
            } else {
                this.classList.add('input-ok'); this.classList.remove('input-error');
                msg.textContent = '✅ Correo válido';
                msg.className = 'campo-msg ok';
            }
        });

        // =====================
        // VALIDAR CÉDULA y habilitar MetaMap
        // =====================
        document.getElementById('cedula').addEventListener('input', function () {
            // Solo números
            this.value = this.value.replace(/[^0-9]/g, '');
            const val = this.value.trim();
            if (val === '') {
                this.className = ''; msg.textContent = '';
            } else if (val.length < 6 || val.length > 10) {
                this.classList.add('input-error'); this.classList.remove('input-ok');
                msg.textContent = '❌ La cédula debe tener entre 6 y 10 dígitos';
                msg.className = 'campo-msg error';
            } else {
                this.classList.add('input-ok'); this.classList.remove('input-error');
                msg.textContent = '✅ Cédula válida';
                msg.className = 'campo-msg ok';
            }
        });

        // =====================
        // VALIDAR CONTRASEÑA
        // =====================
        document.getElementById('password1').addEventListener('input', function () {
            const val = this.value;
            const msg = document.getElementById('msg-password1');
            if (val === '') {
                this.className = ''; msg.textContent = '';
            } else if (val.length < 8) {
                this.classList.add('input-error'); this.classList.remove('input-ok');
                msg.textContent = '❌ Mínimo 8 caracteres';
                msg.className = 'campo-msg error';
            } else {
                this.classList.add('input-ok'); this.classList.remove('input-error');
                msg.textContent = '✅ Contraseña válida';
                msg.className = 'campo-msg ok';
            }
            validarConfirmar();
        });

        // =====================
        // CONFIRMAR CONTRASEÑA
        // =====================
        document.getElementById('password2').addEventListener('input', validarConfirmar);

        function validarConfirmar() {
            const p1 = document.getElementById('password1').value;
            const p2 = document.getElementById('password2').value;
            const msg = document.getElementById('msg-password2');
            if (p2 === '') {
                document.getElementById('password2').className = '';
                msg.textContent = '';
            } else if (p1 !== p2) {
                document.getElementById('password2').classList.add('input-error');
                document.getElementById('password2').classList.remove('input-ok');
                msg.textContent = '❌ Las contraseñas no coinciden';
                msg.className = 'campo-msg error';
            } else {
                document.getElementById('password2').classList.add('input-ok');
                document.getElementById('password2').classList.remove('input-error');
                msg.textContent = '✅ Contraseñas coinciden';
                msg.className = 'campo-msg ok';
            }
        }



        // =====================
        // MOSTRAR/OCULTAR CONTRASEÑA
        // =====================
        function togglePassword(id, btn) {
            const input = document.getElementById(id);
            const eyeOpen   = btn.querySelector('.eye-open');
            const eyeClosed = btn.querySelector('.eye-closed');
            if (input.type === "password") {
                input.type = "text";
                eyeOpen.style.display = "none";
                eyeClosed.style.display = "block";
            } else {
                input.type = "password";
                eyeOpen.style.display = "block";
                eyeClosed.style.display = "none";
            }
        }
    </script>
</body>
</html>
